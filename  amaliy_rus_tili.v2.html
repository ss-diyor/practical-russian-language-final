<!DOCTYPE html>
<html lang="ru" data-theme="light"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Final Exam</title>
<script>
(function(){var t=null;try{t=localStorage.getItem('rt-theme')}catch(e){}
if(!t)t=window.matchMedia&&matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light';
document.documentElement.setAttribute('data-theme',t)})();
</script>
<style>
:root{--fs:1;--bg:#f4f6fb;--card:#fff;--tx:#1c2333;--mu:#6a7388;--ln:#dfe3ee;--ac:#4361ee;--acs:#e8ecff;--ok:#16a34a;--oks:#dcf5e5;--no:#dc2626;--nos:#fde4e4;--mark:#ffe58a}
:root[data-theme="dark"]{--bg:#12151d;--card:#1c212d;--tx:#e8ebf3;--mu:#97a0b5;--ln:#2c3343;--ac:#7f97ff;--acs:#252d4d;--ok:#4ade80;--oks:#143023;--no:#f87171;--nos:#3a1c1f;--mark:#6b5a10}
*{box-sizing:border-box}
html{font-size:calc(16px*var(--fs))}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx);line-height:1.5;font-size:1rem}
.w{max-width:720px;margin:0 auto;padding:0 14px 60px}
.tb{position:sticky;top:0;z-index:30;background:var(--bg);display:flex;justify-content:flex-end;gap:6px;padding:10px 0}
.ib{width:42px;height:42px;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--ln);background:var(--card);color:var(--tx);border-radius:11px;padding:0}
.ib:hover{border-color:var(--ac);color:var(--ac)}.ib.on{background:var(--ac);border-color:var(--ac);color:#fff}
.ib:disabled{opacity:.4;cursor:default}
.ib svg,.ic svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ic{display:inline-flex;vertical-align:-4px;margin-right:4px}.ic svg{width:1.1em;height:1.1em}
#pExit{display:none}.ib.on #pUser{display:none}.ib.on #pExit{display:block}#sun{display:none}:root[data-theme="dark"] #sun{display:block}:root[data-theme="dark"] #moon{display:none}
.card{background:var(--card);border:1px solid var(--ln);border-radius:16px;padding:20px}
h1{font-size:1.4rem;margin:0 0 4px}h2{font-size:1.1rem;margin:0 0 10px}
.mu{color:var(--mu);font-size:.9rem}
.mode{border:2px solid var(--ln);border-radius:14px;padding:16px;margin-top:14px}
button{font:inherit;cursor:pointer}
.btn{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:12px 18px;font-weight:600}
:root[data-theme="dark"] .btn{color:#0f1220}
.btn.sec{background:var(--acs);color:var(--ac)}
:root[data-theme="dark"] .btn.sec{color:var(--ac)}
.btn:disabled{opacity:.4;cursor:default}
.btn.full{width:100%;margin-top:10px}
input[type=number],input[type=search]{width:100px;font:inherit;padding:10px;border:2px solid var(--ln);border-radius:10px;background:var(--bg);color:var(--tx)}
input[type=search]{width:100%;padding:12px 14px;outline:none}input[type=search]:focus{border-color:var(--ac)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.chip{background:var(--acs);color:var(--ac);border:0;border-radius:8px;padding:5px 12px;font-weight:600}
.err{color:var(--no);font-size:.9rem;min-height:1.3em;margin-top:6px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-size:.9rem;color:var(--mu)}
.bar{height:8px;background:var(--ln);border-radius:8px;overflow:hidden;margin-bottom:14px}.bar i{display:block;height:100%;background:var(--ac);width:0;transition:width .25s}
.q{font-size:1.15rem;font-weight:600;margin:4px 0 14px}
.o{display:flex;gap:10px;width:100%;text-align:left;background:var(--card);color:var(--tx);border:2px solid var(--ln);border-radius:12px;padding:12px 14px;margin-bottom:9px}
.o:hover:not(:disabled){border-color:var(--ac)}.o b{min-width:1.3em;color:var(--ac)}
.o.sel{border-color:var(--ac);background:var(--acs)}
.o.ok{border-color:var(--ok);background:var(--oks)}.o.no{border-color:var(--no);background:var(--nos)}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:8px}
.dots{display:flex;flex-wrap:wrap;gap:5px;margin-top:16px}
.dot{width:30px;height:30px;border-radius:8px;border:1px solid var(--ln);background:var(--card);color:var(--mu);font-size:.75rem;padding:0}
.dot.a{background:var(--acs);color:var(--ac);border-color:var(--ac)}
.dot.ok{background:var(--ok);color:#fff;border-color:var(--ok)}.dot.no{background:var(--no);color:#fff;border-color:var(--no)}
.dot.c{outline:2px solid var(--ac);outline-offset:1px}
.score{text-align:center}.big{font-size:3rem;font-weight:800;line-height:1.1}
.stats{display:flex;justify-content:center;gap:22px;margin:10px 0 14px;flex-wrap:wrap}
.stats div{font-weight:600}.g{color:var(--ok)}.r{color:var(--no)}
.tabs{display:flex;gap:8px;margin:18px 0 10px;flex-wrap:wrap}
.rv{border:1px solid var(--ln);border-left:6px solid var(--ln);border-radius:12px;padding:12px 14px;margin-bottom:10px;background:var(--card)}
.rv.c{border-left-color:var(--ok)}.rv.w{border-left-color:var(--no)}
.rv p{margin:2px 0 6px;font-weight:600}.rv div{font-size:.95rem}
.so{padding:7px 12px;border:1px solid var(--ln);border-radius:8px;margin-top:6px;font-size:.95rem}
.so b{display:inline-block;min-width:1.5em}
.so.ok{background:var(--oks);border-color:var(--ok);color:var(--ok);font-weight:600}
.so.hit{outline:2px solid var(--ac)}
.tag{font-size:.75rem;background:var(--acs);color:var(--ac);border-radius:6px;padding:1px 7px;margin-right:4px;white-space:nowrap}
mark{background:var(--mark);color:inherit;border-radius:3px;padding:0 1px}
label.t{display:flex;gap:8px;align-items:center;margin-top:14px;font-size:.92rem}
.empty{text-align:center;color:var(--mu);padding:30px 0}
input[type=text]{width:100%;font:inherit;padding:12px 14px;border:2px solid var(--ln);border-radius:10px;background:var(--bg);color:var(--tx);outline:none;margin-top:6px}
input[type=text]:focus{border-color:var(--ac)}
.fl{display:block;margin-top:16px;font-weight:600;font-size:.95rem}
.who{display:flex;align-items:center;gap:8px;color:var(--mu);font-size:.9rem;margin-bottom:12px}
.av{width:56px;height:56px;border-radius:50%;background:var(--acs);color:var(--ac);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:1.2rem;flex:none}
.ph{display:flex;align-items:center;gap:14px;flex-wrap:wrap}.ph>div:nth-child(2){flex:1;min-width:140px}
.ph h1{margin:0}
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
.kp div{background:var(--bg);border:1px solid var(--ln);border-radius:12px;padding:10px;text-align:center}
.kp b{display:block;font-size:1.3rem}.kp span{font-size:.8rem;color:var(--mu)}
.sc{overflow-x:auto;border:1px solid var(--ln);border-radius:12px;background:var(--card)}
table{border-collapse:collapse;width:100%;min-width:560px;font-size:.9rem}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--ln);white-space:nowrap}
th{color:var(--mu);font-weight:600;font-size:.8rem;background:var(--bg)}tr:last-child td{border-bottom:0}
.pill{display:inline-block;border-radius:999px;padding:1px 10px;font-weight:700;font-size:.85rem}
.pill.ok{background:var(--oks);color:var(--ok)}.pill.no{background:var(--nos);color:var(--no)}.pill.mid{background:var(--acs);color:var(--ac)}
.prow{display:flex;align-items:center;gap:10px;border:1px solid var(--ln);background:var(--card);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.prow>div:first-child{flex:1;min-width:0}.prow b{display:block;overflow:hidden;text-overflow:ellipsis}
.sm{padding:7px 12px;font-size:.9rem}
h2.sec{margin:22px 0 10px}
[hidden]{display:none!important}

input[type=password],textarea{width:100%;font:inherit;padding:12px 14px;border:2px solid var(--ln);border-radius:10px;background:var(--bg);color:var(--tx);outline:none;margin-top:6px}
textarea{resize:vertical;min-height:80px}input[type=password]:focus,textarea:focus{border-color:var(--ac)}
.num{display:inline-block;background:var(--ac);color:#fff;border-radius:7px;padding:0 8px;font-size:.85rem;font-weight:600;flex:none}
:root[data-theme="dark"] .num{color:#0f1220}
.abar{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.note{margin-top:10px;font-size:.85rem;color:var(--mu);background:var(--bg);border:1px solid var(--ln);border-radius:10px;padding:8px 12px}
.msg{min-height:1.3em;margin-top:8px;font-size:.9rem;color:var(--ok)}
.arow{display:flex;align-items:center;gap:10px;border:1px solid var(--ln);background:var(--card);border-radius:12px;padding:10px 12px;margin-bottom:8px;cursor:pointer}
.arow:hover{border-color:var(--ac)}.arow .at{flex:1;min-width:0}
.aq{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-weight:600;font-size:.95rem}
.ck{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:.92rem}
.eo{border:1px solid var(--ln);border-radius:12px;padding:4px 12px 12px;margin-top:12px}
.ib.fl{width:36px;height:36px;flex:none}
.tag.mod{background:var(--nos);color:var(--no)}.tag.nw{background:var(--oks);color:var(--ok)}

.ib.lg{width:auto;padding:0 12px;gap:6px;font-weight:700;font-size:.8rem}.ib.lg svg{width:18px;height:18px}
</style></head><body><div class="w">

<div class="tb">
<button class="ib lg" id="bLang" aria-label="Language"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg><span id="lgTxt"></span></button>
<button class="ib" id="bProfile" data-al="aProfile"><svg id="pUser" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg><svg id="pExit" viewBox="0 0 24 24"><path d="M15 21h4a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2h-4"/><path d="m8 17-5-5 5-5"/><path d="M3 12h12"/></svg></button>
<button class="ib" id="bSearch" data-al="aSearch"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></button>
<button class="ib" id="fMinus" data-al="aFMinus"><svg viewBox="0 0 24 24"><path d="M3 18 8 6l5 12M5 14h6"/><path d="M16 12h6"/></svg></button>
<button class="ib" id="fPlus" data-al="aFPlus"><svg viewBox="0 0 24 24"><path d="M3 18 8 6l5 12M5 14h6"/><path d="M19 9v6M16 12h6"/></svg></button>
<button class="ib" id="bTheme" data-al="aTheme">
<svg id="moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
<svg id="sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
</button>
</div>

<section id="start" class="card">
<div class="who" id="who"></div>
<h1 data-i="title" id="title1" style="user-select:none"></h1>
<div class="mu" id="sub"></div>
<div class="mode"><h2 data-i="modeA"></h2><div class="mu" data-i="modeAd"></div>

<button class="btn full" id="goRand" data-i="goRand"></button></div>

</section>

<div class="r"><span class="ic"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></span><span id="nw"></span> <span data-i="wrong"></span></div>
<div class="mu"><span class="ic"><svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg></span><span id="ns"></span> <span data-i="skipped"></span></div></div>

<div class="tabs"><button class="chip" data-f="all" data-i="fAll"></button><button class="chip" data-f="w" data-i="fWrong"></button><button class="chip" data-f="c" data-i="fCorrect"></button></div>

</section>

</section>

<div class="ph"><div class="av" id="pAv"></div><div><h1 id="pTitle"></h1><div class="mu" id="pGrp"></div></div>

<div class="kp"><div><b id="kA"></b><span data-i="attempts"></span></div><div><b id="kAvg"></b><span data-i="average"></span></div><div><b id="kBest"></b><span data-i="best"></span></div></div>
</div>

<button class="btn sec sm" id="hClear" style="margin-top:10px" data-i="clearH" hidden></button>

</section>

/* ---------- Start screen ---------- */
function buildStart(){$('cnt').max=BANK.length;$('chips').innerHTML='';
 [10,20,30,50,100].filter(n=>n<=BANK.length).forEach(n=>{const b=document.createElement('button');b.className='chip';b.textContent=n;b.onclick=()=>$('cnt').value=n;$('chips').appendChild(b)});

 if(!Number.isInteger(n)||n<1||n>BANK.length){$('err').textContent=t('errCount',BANK.length);return}

/* ---------- Quiz ---------- */
/* ans[i] = original option index (0-3); the displayed letter is its position in x.ord */
function begin(list,name){set=list.map(x=>({...x,ord:shuffle([0,1,2,3])}));ans=new Array(set.length).fill(null);i=0;label=name;instant=$('instant').checked;show('quiz');
 $('dots').innerHTML='';set.forEach((_,k)=>{const d=document.createElement('button');d.className='dot';d.textContent=k+1;d.onclick=()=>{i=k;render()};$('dots').appendChild(d)});render();window.scrollTo(0,0)}
function render(){const x=set[i],a=ans[i],locked=instant&&a!==null;
 $('mode').textContent=t('mode_'+label);$('pos').textContent=t('pos',i+1,set.length);
 $('pb').style.width=(ans.filter(v=>v!==null).length/set.length*100)+'%';
 $('qt').innerHTML=fmt(x.q);
 $('opts').innerHTML=x.ord.map((k,p)=>{let c='o';if(locked){if(x.c.includes(k))c+=' ok';else if(k===a)c+=' no'}else if(k===a)c+=' sel';
  return `<button class="${c}" data-k="${k}" ${locked?'disabled':''}><b>${LET[p]})</b><span>${fmt(x.o[k])}</span></button>`}).join('');
 $('opts').querySelectorAll('.o').forEach(b=>b.onclick=()=>{ans[i]=+b.dataset.k;render()});
 $('prev').disabled=i===0;$('next').textContent=t(i===set.length-1?'finish':'next');
 $('dots').querySelectorAll('.dot').forEach((d,k)=>{d.className='dot'+(ans[k]===null?'':instant?(isOk(set[k],ans[k])?' ok':' no'):' a')+(k===i?' c':'')})}
function goNext(){if(i<set.length-1){i++;render();return}
 const left=ans.filter(v=>v===null).length;
 if(left&&!confirm(t('unans',left)))return;finish()}
$('prev').onclick=()=>{if(i>0){i--;render()}};
$('next').onclick=goNext;
$('quit').onclick=()=>{if(confirm(t('quitQ')))show('start')};

/* ---------- Result ---------- */
function resultText(){if(!lastRes)return;const{c,w,s,p,n,saved}=lastRes;
 $('pct').textContent=p+'%';$('nc').textContent=c;$('nw').textContent=w;$('ns').textContent=s;
 $('msg').textContent=t('outOf',c,n)+' · '+t(p>=86?'p1':p>=71?'p2':p>=56?'p3':'p4');
 $('saved').textContent=saved?t('saved'):'';$('retryW').hidden=(w+s)===0}
function finish(){let c=0,w=0,s=0;ans.forEach((a,k)=>{if(a===null)s++;else if(isOk(set[k],a))c++;else w++});
 const p=Math.round(c/set.length*100),pr=me();let saved=false;
 if(pr){pr.history.push({t:Date.now(),mode:label,total:set.length,c,w,s,p});saveDB();saved=true}
 lastRes={c,w,s,p,n:set.length,saved};resultText();filter='all';review();show('result');window.scrollTo(0,0)}
function uniq(a){return a.filter((v,k)=>a.indexOf(v)===k)}
function review(){$('review').innerHTML=set.map((x,k)=>{const a=ans[k],ok=isOk(x,a);if(filter==='w'&&ok)return'';if(filter==='c'&&!ok)return'';
 const corr=uniq(x.c.map(j=>x.o[j]));
 return `<div class="rv ${ok?'c':'w'}"><p>${k+1}. ${fmt(x.q)}</p>
 <div>${t('yourAns')}: <b class="${ok?'g':'r'}">${a!==null?fmt(x.o[a]):t('skip')}</b></div>
 ${ok?'':`<div>${t(corr.length>1?'corrAnsP':'corrAns')}: <b class="g">${corr.map(fmt).join(' / ')}</b></div>`}</div>`}).join('')||`<div class="empty">${t('nothing')}</div>`}
document.querySelectorAll('.tabs .chip').forEach(b=>b.onclick=()=>{filter=b.dataset.f;review()});
$('again').onclick=()=>show('start');
$('retryW').onclick=()=>begin(set.filter((x,k)=>!isOk(x,ans[k])),'retry');

/* ---------- Keyboard ---------- */
document.addEventListener('keydown',e=>{
 if(cur!=='quiz'||e.ctrlKey||e.metaKey||e.altKey)return;
 const tg=e.target;if(tg&&(tg.tagName==='INPUT'||tg.tagName==='TEXTAREA'))return;
 const k=e.key;
 if(k==='ArrowRight'){e.preventDefault();if(i<set.length-1){i++;render()}}
 else if(k==='ArrowLeft'){e.preventDefault();if(i>0){i--;render()}}
 else if(/^[1-4]$/.test(k)){e.preventDefault();if(instant&&ans[i]!==null)return;ans[i]=set[i].ord[+k-1];render()}
 else if(k==='Enter'&&i===set.length-1){e.preventDefault();if(document.activeElement)document.activeElement.blur();goNext()}
});

/* ---------- Global search ---------- */
const norm=s=>s.toLowerCase().replace(/ё/g,'е').replace(/[\u2018\u2019\u02bb\u02bc\u02b9`\u00b4]/g,"'");
function hl(text,terms){text=plain(text);if(!terms.length)return fmt(text);const n=norm(text),r=[];
 terms.forEach(tm=>{let p=0;while((p=n.indexOf(tm,p))>-1){r.push([p,p+tm.length]);p+=tm.length}});
 if(!r.length)return fmt(text);r.sort((a,b)=>a[0]-b[0]);const m=[r[0].slice()];
 for(const q of r.slice(1)){const l=m[m.length-1];if(q[0]<=l[1])l[1]=Math.max(l[1],q[1]);else m.push(q.slice())}
 let o='',p=0;m.forEach(([s,e])=>{o+=esc(text.slice(p,s))+'<mark>'+esc(text.slice(s,e))+'</mark>';p=e});return o+esc(text.slice(p))}
$('bSearch').onclick=()=>{if(cur==='search'){show(beforeSearch);return}beforeSearch=cur;show('search');$('sq').focus();runSearch()};
let tmr;$('sq').addEventListener('input',()=>{clearTimeout(tmr);tmr=setTimeout(runSearch,120)});
function runSearch(){const raw=$('sq').value.trim();
 if(!raw){$('sinfo').textContent='';$('slist').innerHTML='';return}
 const terms=norm(raw).split(/\s+/).filter(Boolean),found=[];
 BANK.forEach(x=>{const f=[['q',norm(plain(x.q))],...x.o.map((o,k)=>[k,norm(plain(o))])];
  const all=f.map(v=>v[1]).join(' | ');
  const num=terms.length===1&&/^\d+$/.test(terms[0])&&+terms[0]===x.n;
  if(!num&&!terms.every(tm=>all.includes(tm)))return;
  const hits=new Set(),where=[];f.forEach(([k,s])=>{if(terms.some(tm=>s.includes(tm)))hits.add(k)});
  if(num)where.push(t('tNum'));if(hits.has('q'))where.push(t('tQ'));[0,1,2,3].forEach(k=>{if(hits.has(k))where.push(t('tOpt',LET[k]))});
  found.push({x,hits,where})});
 $('sinfo').textContent=found.length?t('sRes',found.length):t('sNone');
 $('slist').innerHTML=found.length?found.map(({x,hits,where})=>`<div class="card" style="margin-bottom:10px;padding:14px 16px">
  <div class="q" style="font-size:1.05rem">${x.n}. ${hl(x.q,terms)}</div>
  ${x.o.map((o,k)=>`<div class="so${x.c.includes(k)?' ok':''}${hits.has(k)?' hit':''}"><b>${LET[k]})</b> ${hl(o,terms)}</div>`).join('')}
  <div class="mu" style="margin-top:10px">${where.map(w=>'<span class="tag">'+w+'</span>').join('')}</div></div>`).join(''):`<div class="empty">${t('sEmpty')}</div>`}
